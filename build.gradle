plugins {
    // Minecraft 1.21.11 and older are obfuscated, so this backport uses the
    // remapping Loom plugin with Mojang's official mappings.
    id 'net.fabricmc.fabric-loom-remap' version '1.17.21'
    id 'java'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

// Java level required by the target Minecraft version (see gradle.properties).
def targetJava = (project.java_version as String) as int

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(targetJava)
    }
    withSourcesJar()
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()

    // Access widener (the file keeps its .classtweaker name from the 26.x build).
    accessWidenerPath = file("src/client/resources/trade-reorder.classtweaker")

    mods {
        "trade-reorder" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    // Obfuscated Minecraft: use Mojang's official names so the source keeps the
    // same identifiers as the 26.x code.
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = targetJava
}

// The remapped jar is the release artifact; the plain (named) jar is dev-only.
jar {
    archiveClassifier = "dev"
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

remapJar {
    archiveFileName = "${project.archives_base_name}-${project.mod_version}.jar"
}

remapSourcesJar {
    archiveFileName = "${project.archives_base_name}-${project.mod_version}-sources.jar"
}

// Load the packaged mod through Fabric/Mixin without opening a game window.
// Compilation alone cannot validate @Shadow and injection targets.
sourceSets {
    smokeTest {
        compileClasspath += sourceSets.client.runtimeClasspath
        runtimeClasspath += sourceSets.client.runtimeClasspath
    }
}

tasks.register('mixinSmokeTest', JavaExec) {
    dependsOn tasks.jar, tasks.smokeTestClasses
    def smokeClasspath = sourceSets.smokeTest.runtimeClasspath - sourceSets.main.output - sourceSets.client.output
    smokeClasspath += files(tasks.jar.archiveFile)
    // A long classpath makes Gradle wrap it in a manifest-only jar on Windows,
    // which Fabric Loader cannot see through. Hand it to java in an @argfile instead.
    inputs.files(smokeClasspath)
    doFirst {
        def argFile = new File(temporaryDir, 'classpath.args')
        argFile.text = '-cp "' + smokeClasspath.asPath.replace('\\', '/') + '"'
        jvmArgs "@${argFile.absolutePath}"
    }
    mainClass = 'net.fabricmc.loader.impl.launch.knot.KnotClient'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(targetJava)
    }
    systemProperty 'fabric.development', 'true'
    workingDir = layout.buildDirectory.dir('mixin-smoke-run').get().asFile
    doFirst { workingDir.mkdirs() }
}

tasks.check { dependsOn tasks.mixinSmokeTest }
